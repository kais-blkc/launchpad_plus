name: Release

# Релиз создаётся при пуше тега вида v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15   # Apple Silicon, Xcode 16 (нужен SDK 15 для .pointerStyle)
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          make dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/Launchpad-Plus-*.dmg build/Launchpad-Plus-*.dmg.sha256 \
            --title "Launchpad+ ${GITHUB_REF_NAME#v}" \
            --generate-notes
